<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CIMED - Casos</title>
    <link rel="icon" type="image/png" href="images/CimarronMedicoIndexIcon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/CIMAHUB.css" />
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="./">
                <span class="brand-name">
                    <span class="brand-ci">CI</span><span class="brand-med">MED</span>
                </span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="./" style="margin-left: 120px;">Inicio</a>
                    </li>
                </ul>
            </div>
            <div class="d-flex align-items-center gap-2">
                <a href="./" class="btn btn-primary btn-exit d-flex align-items-center">
                    <i class="bi bi-box-arrow-left me-2"></i> Regresar
                </a>
            </div>
        </div>
    </nav>

    <!-- Main -->
    <main>
        <div class="container my-4" id="cases-container">
            <!-- Cargando... -->
            <div class="text-center py-5">
                <div class="spinner-border text-success" role="status">
                    <span class="visually-hidden">Cargando...</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer mt-auto py-3 bg-light">
        <div class="container text-center">
            <span class="text-muted">Cuarta Generación de Ingeniería en Software © 2024</span>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/secrets.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const SUPABASE_URL = SECRETS.SUPABASE_URL;
        const SUPABASE_KEY = SECRETS.SUPABASE_KEY;
        const supabaseInstance = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function toggleFolder(id, header) {
            const el = document.getElementById(id);
            const isHidden = el.style.display === 'none';
            el.style.display = isHidden ? '' : 'none';
            header.classList.toggle('collapsed', !isHidden);
        }

        async function loadCases() {
            try {
                const { data: cases, error } = await supabaseInstance
                    .from('casos_clinicos')
                    .select('*, signos_vitales(*), estudios(*), procedimientos(*), preguntas_quiz(*)');

                if (error) throw error;
                renderCases(cases);
            } catch (e) {
                console.error("Error cargando casos de Supabase:", e);
                document.getElementById('cases-container').innerHTML =
                    '<div class="alert alert-danger">Error al conectar con el servidor SQL de Supabase. Verifique sus credenciales en el código.</div>';
            }
        }

        function renderCases(cases) {
            const container = document.getElementById('cases-container');
            container.innerHTML = '';

            const folders = [...new Set(cases.map(c => c.carpeta))].sort((a, b) => {
                if (a === "Sin carpeta") return 1;
                if (b === "Sin carpeta") return -1;
                return a.localeCompare(b);
            });

            folders.forEach(folderName => {
                const folderCases = cases.filter(c => c.carpeta === folderName);
                const section = document.createElement('div');
                section.className = `folder-section ${folderName === 'Sin carpeta' ? 'section-sin-carpeta' : ''}`;

                const folderId = `folder-${folderName.replace(/\s+/g, '-')}`;

                section.innerHTML = `
                    <div class="folder-header" onclick="toggleFolder('${folderId}', this)">
                        <i class="bi ${folderName === 'Sin carpeta' ? 'bi-folder2' : 'bi-folder-fill'} folder-icon"></i>
                        <span class="folder-name">${folderName}</span>
                        <span class="folder-count">${folderCases.length} caso(s)</span>
                        <i class="bi bi-chevron-down chevron"></i>
                    </div>
                    <div class="folder-cases row" id="${folderId}">
                        ${folderCases.map(c => `
                            <div class="col-md-4">
                                <div class="card case-card mb-3">
                                    <div class="card-body d-flex justify-content-between align-items-center">
                                        <div>
                                            <h5 class="card-title">${c.titulo}</h5>
                                        </div>
                                        <a href="#" class="btn-play" data-bs-toggle="modal"
                                           data-bs-target="#caseModal${c.id}" style="margin-left:10px;">
                                            <i class="bi bi-play-circle-fill"></i>
                                        </a>
                                    </div>
                                </div>
                            </div>
                            <!-- Modal del caso -->
                            <div class="modal fade" id="caseModal${c.id}" tabindex="-1" aria-hidden="true">
                                <div class="modal-dialog modal-md">
                                    <div class="modal-content">
                                        <div class="modal-header">
                                            <h5 class="modal-title">Detalles del Caso Clínico</h5>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                        </div>
                                        <div class="modal-body">
                                            <h2 class="text-success">Nombre del Caso: ${c.titulo}</h2>
                                            <br>
                                            <p>${c.anamnesis || c.resumen}</p>
                                            <div class="text-center mt-4">
                                                <button class="btn btn-success btn-play">
                                                    <a href="CIMAHUB SIMULACIÓN.html?id=${c.id}" class="text-white text-decoration-none">
                                                        <i class="bi bi-play-circle-fill me-2"></i> Iniciar Simulación
                                                    </a>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                container.appendChild(section);
            });
        }

        loadCases();
    </script>
</body>

</html>
