<body>
  <header class="header">

  <main class="container">
    <div class="card loading">
      <div class="status-indicator"></div> <a href="https://cimahub-fcitec.tij.uabc.mx/CIMED/" class="card-link"
        aria-label="Acceder al sistema CIMED">
        <div class="card-image"> <img src="img/cimedLogo.png" alt="Logo del sistema CIMED" loading="lazy">
        </div>
        <h2 class="card-title">CIMED<br>Simulador Médico</h2>
      </a>
    </div>

    <div class="card loading">
      <div class="status-indicator"></div> <a href="https://cimahub-fcitec.tij.uabc.mx/emprendedores/" class="card-link"
        aria-label="Acceder al sistema de Expoemprendedores">
        <div class="card-image"> <img src="img/emp-fcitec.png" alt="Logo del sistema Expoemprendedores" loading="lazy">
        </div>
        <h2 class="card-title">Expo Emprendedores<br>FCITEC</h2>
      </a>
    </div>

    
    <div class="card loading">
      <div class="status-indicator"></div> <a href="https://cimahub-fcitec.tij.uabc.mx/cimaemprendedores/" class="card-link"
        aria-label="Acceder a Cimamprendedores">
        <div class="card-image"> <img src="img/cima-emp-uabc.png" alt="Logo de Cimaemprendedores" loading="lazy">

	  <div class="card loading">
      <div class="status-indicator"></div> <a href="https://cimahub-fcitec.tij.uabc.mx/cimatank" class="card-link"

      </a>
    </div>

    <div class="card loading">
      <div class="status-indicator"></div> <a href="https://cimahub-fcitec.tij.uabc.mx/sdgku/Front-end/index.html" class="card-link"
        aria-label="Acceder al sistema de SDGKU">

    </div>

     <div class="card loading">

        <div class="card-image"> <img src="img/LOGO.svg" width="150" height="75" alt="Logo de Ceretic Reporta" loading="lazy">
        </div>

    </div>
	  
  </main>
  <script>    // Add loading animation on scroll    const observerOptions = {      threshold: 0.1,      rootMargin: '0px 0px -50px 0px'    };    const observer = new IntersectionObserver((entries) => {      entries.forEach(entry => {        if (entry.isIntersecting) {          entry.target.style.animationPlayState = 'running';        }      });    }, observerOptions);    document.querySelectorAll('.loading').forEach(card => {      observer.observe(card);    });    // Add smooth hover effects    document.querySelectorAll('.card').forEach(card => {      card.addEventListener('mouseenter', function() {        this.style.transform = 'translateY(-15px) scale(1.02)';      });            card.addEventListener('mouseleave', function() {        this.style.transform = 'translateY(0) scale(1)';      });    });    // Keyboard navigation improvements    document.addEventListener('keydown', function(e) {      if (e.key === 'Tab') {        document.body.classList.add('keyboard-nav');      }    });    document.addEventListener('mousedown', function() {      document.body.classList.remove('keyboard-nav');    });  </script>
</body>

</html>
